  <script>
    /* Before first paint: the saved theme and sidebar, so the page never
       flashes the wrong colours. The shell is hidden only under html.js; the
       failsafe shows it if the script never runs. Under ?record the page
       waits for the rig and ignores saved choices. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('vessa:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          if (localStorage.getItem('vessa:side') === '1') d.classList.add('side-open');
          var a = localStorage.getItem('vessa:accent');
          if (a && /^(#|pine$|cobalt$|ocean$|graphite$)/.test(a)) d.dataset.accent = a.charAt(0) === '#' ? 'custom' : a;
          if (localStorage.getItem('vessa:signedout') === '1') d.classList.add('signed-out');
        }
      } catch (e) {}
      if (!rec) setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);

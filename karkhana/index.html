  <script>
    /* Before first paint: the saved theme and accent, so the page never
       flashes the wrong colours. The shell is hidden only under html.js; the
       failsafe shows it if the script never runs. Under ?record the page
       waits for the rig and ignores saved choices. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('cadra:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          d.dataset.accent = JSON.parse(localStorage.getItem('cadra:accent') || '"ocean"');
        }
      } catch (e) {}
      if (!rec) setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);

<script>(()=>{const p=document.querySelector('.cc-preview-pill');if(!p)return;const fit=()=>{p.style.removeProperty('--cc-lift');const a=p.getBoundingClientRect(),h=innerHeight;let top=h;for(const el of document.body.querySelectorAll('*')){if(el===p||p.contains(el))continue;const s=getComputedStyle(el);if((s.position!=='fixed'&&s.position!=='sticky')||s.display==='none'||s.visibility==='hidden'||s.opacity==='0')continue;const r=el.getBoundingClientRect();if(r.height&&r.height<200&&r.top>h/2&&r.bottom>=h-40&&r.left<a.right&&r.right>a.left)top=Math.min(top,r.top)}if(top<h)p.style.setProperty('--cc-lift',h-top+10+'px')};addEventListener('load',()=>{fit();setTimeout(fit,1500)});addEventListener('resize',fit)})()</script>

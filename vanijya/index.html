    /* Before first paint: the saved theme and palette, so the page never flashes the
       wrong colours. The app is hidden only under html.js (the load
       choreography reveals it); the failsafe shows it if the script never runs. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);   /* a rig is filming: light, wait for it */
      if (rec) d.classList.add('is-record');
      try {
        var t = rec ? 'light' : JSON.parse(localStorage.getItem('corbel:theme') || '"light"');
        d.dataset.theme = t === 'dark' ? 'dark' : 'light';
        /* the colour palette (Settings → Appearance); black and white unless chosen */
        var p = rec ? 'mono' : JSON.parse(localStorage.getItem('corbel:palette') || '"mono"');
        d.dataset.palette = /^(mono|pastel|ocean|sage)$/.test(p) ? p : 'mono';
      } catch (e) {}
      if (!rec) setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);

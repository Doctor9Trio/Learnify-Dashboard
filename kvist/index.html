    <script>
      /* Capture mode, for screen-recording a demo; visitors never open the page this way.
         ?record&slow=2 runs every clock the page reads (rAF timestamps, performance.now,
         Date.now, timers) 2× slower, and keeps Motion off WAAPI so all of its animations
         follow those clocks: a recorder filming at half speed gets a smooth 60fps.
         Safe to delete with src/lib/record.js. */
      (function () {
        var q = new URLSearchParams(location.search)
        if (!q.has('record')) return
        var S = Number(q.get('slow')) || 1
        if (S === 1) return
        delete Element.prototype.animate
        var pn = performance.now.bind(performance), r0 = pn()
        /* __kvistDrive(clock): from now on every clock reads the recorder's frame
           clock (ms of video time), continuing from where it stands */
        var drive = null, off = 0
        var v = function (t) { return drive ? off + drive() : r0 + (t - r0) / S }
        window.__kvistDrive = function (fn) { var now = v(pn()); off = now - fn(); drive = fn }
        performance.now = function () { return v(pn()) }
        var d0 = Date.now()
        Date.now = function () { return Math.floor(d0 + v(pn()) - r0) }
        var raf = window.requestAnimationFrame.bind(window)
        window.requestAnimationFrame = function (cb) { return raf(function (t) { cb(v(t)) }) }
        var st = window.setTimeout.bind(window), si = window.setInterval.bind(window)
        window.setTimeout = function (fn, ms) { return st.apply(window, [fn, (ms || 0) * S].concat([].slice.call(arguments, 2))) }
        window.setInterval = function (fn, ms) { return si.apply(window, [fn, (ms || 0) * S].concat([].slice.call(arguments, 2))) }
      })()
    </script>
